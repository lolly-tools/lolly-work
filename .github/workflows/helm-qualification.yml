# SPDX-License-Identifier: MPL-2.0
name: Helm qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      screenshots:
        description: Also capture marketplace listing screenshots from the neutral fixture
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: helm-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm profiles and strict schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.11.1'
          cache: pnpm
      - name: Install frozen project dependencies
        run: pnpm install --frozen-lockfile
      - name: Install checksum-pinned validation tools
        run: |
          set -euo pipefail
          lolly_tools_dir="$RUNNER_TEMP/lolly-helm-tools"
          mkdir -p "$lolly_tools_dir/bin" "$lolly_tools_dir/downloads"
          cd "$lolly_tools_dir/downloads"
          curl -fsSL --retry 3 https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz -o helm-v4.2.3-linux-amd64.tar.gz
          echo 'e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  helm-v4.2.3-linux-amd64.tar.gz' | sha256sum -c -
          tar -xzf helm-v4.2.3-linux-amd64.tar.gz linux-amd64/helm
          install -m 0755 linux-amd64/helm "$lolly_tools_dir/bin/helm"
          curl -fsSL --retry 3 https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o kubeconform-linux-amd64.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform-linux-amd64.tar.gz' | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          install -m 0755 kubeconform "$lolly_tools_dir/bin/kubeconform"
          echo "$lolly_tools_dir/bin" >> "$GITHUB_PATH"
      - name: Require rendered topology and schema checks
        env:
          LW_REQUIRE_HELM_TESTS: '1'
        run: |
          helm version --short
          kubeconform -v
          node --test tests/helm-chart.test.ts tests/helm-profile-schema.test.ts tests/marketplace-packages.test.ts

  neutral-compose:
    name: Neutral Compose installation and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.11.1'
      - run: pnpm install --frozen-lockfile
      - name: Check generated public packages
        run: node scripts/marketplace-packages.ts --check
      # Listing captures run only when a maintainer asks for them, with the
      # Chromium build pinned by the render worker's lockfile.
      - name: Install the capture browser
        if: ${{ inputs.screenshots }}
        timeout-minutes: 15
        run: |
          pnpm -C workers/render install --frozen-lockfile
          pnpm -C workers/render exec playwright-core install --with-deps --no-shell chromium
      - name: Boot the actual pinned neutral package and restore its database
        env:
          LW_MARKETPLACE_RECEIPT: ${{ runner.temp }}/neutral-compose-receipt.json
          LW_MARKETPLACE_SCREENSHOTS: ${{ inputs.screenshots && format('{0}/neutral-listing-screenshots', runner.temp) || '' }}
        run: node scripts/qualify-marketplace-compose.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neutral-compose-${{ github.sha }}
          path: ${{ runner.temp }}/neutral-compose-receipt.json
          if-no-files-found: error
      - name: Keep the listing screenshots for review
        if: ${{ !cancelled() && inputs.screenshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neutral-listing-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/neutral-listing-screenshots
          if-no-files-found: error
