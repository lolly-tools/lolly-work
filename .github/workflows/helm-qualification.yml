# SPDX-License-Identifier: MPL-2.0
name: Helm qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm profiles and strict schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install frozen project dependencies
        run: pnpm install --frozen-lockfile
      - name: Install checksum-pinned validation tools
        run: |
          set -euo pipefail
          lolly_tools_dir="$RUNNER_TEMP/lolly-helm-tools"
          mkdir -p "$lolly_tools_dir/bin" "$lolly_tools_dir/downloads"
          cd "$lolly_tools_dir/downloads"
          curl -fsSL --retry 3 https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz -o helm-v4.2.3-linux-amd64.tar.gz
          echo 'e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  helm-v4.2.3-linux-amd64.tar.gz' | sha256sum -c -
          tar -xzf helm-v4.2.3-linux-amd64.tar.gz linux-amd64/helm
          install -m 0755 linux-amd64/helm "$lolly_tools_dir/bin/helm"
          curl -fsSL --retry 3 https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o kubeconform-linux-amd64.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform-linux-amd64.tar.gz' | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          install -m 0755 kubeconform "$lolly_tools_dir/bin/kubeconform"
          echo "$lolly_tools_dir/bin" >> "$GITHUB_PATH"
      - name: Require rendered topology and schema checks
        env:
          LW_REQUIRE_HELM_TESTS: '1'
        run: |
          helm version --short
          kubeconform -v
          node --test tests/helm-chart.test.ts tests/helm-profile-schema.test.ts
