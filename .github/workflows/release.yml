# Release — on a v* tag, build and push the container images to GHCR:
#   server        — deploy/compose/Dockerfile, repo root context
#   render-worker — workers/render/Dockerfile (Chromium tier), its own context
# Images are tagged with the version (tag minus the leading v) and latest.
# CI (ci.yml) is the quality gate; this workflow only packages and publishes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  # cosign keyless signing exchanges the workflow's OIDC identity for a
  # short-lived certificate - no key to store, nothing to leak (plans/36 §4).
  id-token: write

jobs:
  server-image:
    name: server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prefer a PAT (GHCR_PAT, scope write:packages) when the org caps the
      # GITHUB_TOKEN's package scope to read (first-publish "permission_denied:
      # read_package"). Falls back to GITHUB_TOKEN when the secret is absent.
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Multi-arch (amd64 + arm64): the edge story is Rancher-managed k3s, and
      # edge nodes are frequently ARM — an amd64-only manifest is an instant
      # ImagePullBackOff snag there. All runtime deps ship linux-arm64 builds
      # (resvg native binary; jsdom/pg are pure JS).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # deploy/helm/values.yaml image.repository matches this push target
      # (ghcr.io/lolly-tools/lolly-work-server) under the lolly-tools org, and
      # the chart's empty image.tag defaults to appVersion — kept in sync with
      # package.json "version", so `helm install` pulls exactly this build.
      - name: Build and push (amd64 + arm64, with SBOM + provenance attestations)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/lolly-work-server"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true \
            -f deploy/compose/Dockerfile -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .

      # Keyless signature over the pushed manifest digest - verifiable against
      # this workflow's identity, no signing key anywhere:
      #   cosign verify "$IMAGE:<version>" \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp 'github.com/.+/lolly-work/\.github/workflows/release\.yml@.*'
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ printf "%s" .Manifest.Digest }}')
          cosign sign "$IMAGE@$DIGEST"

  render-worker-image:
    name: render-worker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prefer a PAT (GHCR_PAT, scope write:packages) when the org caps the
      # GITHUB_TOKEN's package scope to read (first-publish "permission_denied:
      # read_package"). Falls back to GITHUB_TOKEN when the secret is absent.
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Multi-arch like the server (Playwright ships linux-arm64 Chromium).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build context is workers/render itself (see its Dockerfile header).
      # deploy/helm/values.yaml renderWorker.image.repository already points at
      # ghcr.io/lolly-tools/lolly-work-render-worker, which matches this under
      # the lolly-tools org.
      - name: Build and push (amd64 + arm64, with SBOM + provenance attestations)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/lolly-work-render-worker"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push workers/render

      # Same keyless signature as the server image - one verify recipe covers both.
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ printf "%s" .Manifest.Digest }}')
          cosign sign "$IMAGE@$DIGEST"
