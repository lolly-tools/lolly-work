# Release — on a v* tag, build and push the container images to GHCR:
#   server        — deploy/compose/Dockerfile, repo root context
#   render-worker — workers/render/Dockerfile (Chromium tier), its own context
# Images are tagged with the version (tag minus the leading v) and latest.
# CI (ci.yml) is the quality gate; this workflow only packages and publishes.
# A manual dispatch can rebuild one image for an existing tag; a tag push
# always builds both.
#
# Every run must start from the release tag itself, so each keyless signature
# names this workflow at that tag:
#   https://github.com/lolly-tools/lolly-work/.github/workflows/release.yml@refs/tags/vX.Y.Z
# Dispatch a rebuild on the tag, for example
#   gh workflow run release.yml --ref v1.2.3 -f version_tag=v1.2.3 -f expected_source_sha=<sha> -f images=server
# A run from a branch stops before it builds anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing version tag to package, for example v1.1.0; dispatch on that same tag (--ref)
        required: true
        type: string
      expected_source_sha:
        description: Full reviewed commit the existing tag must resolve to
        required: true
        type: string
      images:
        description: Images to build and publish (server or worker leaves the other image's tags alone)
        required: false
        type: choice
        default: both
        options: [both, server, worker]

# Each job asks for what it uses: pushing jobs get packages: write, and only
# the signing jobs get id-token: write.
permissions:
  contents: read

jobs:
  release-source:
    name: Verify immutable release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      version: ${{ steps.resolve.outputs.version }}
      server: ${{ steps.images.outputs.server }}
      worker: ${{ steps.images.outputs.worker }}
    steps:
      - name: Validate release selectors
        env:
          RELEASE_TAG: ${{ inputs.version_tag || github.ref_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?', tag):
              raise SystemExit('An existing version tag is required')
          if not re.fullmatch('[a-f0-9]{40}', os.environ['EXPECTED_SOURCE_SHA']):
              raise SystemExit('A full reviewed release source SHA is required')
          # The signing certificate's identity is this workflow ref. Accept only
          # this repository's release.yml at the release tag.
          expected = os.environ['GITHUB_REPOSITORY'] + '/.github/workflows/release.yml@refs/tags/' + tag
          if os.environ['GITHUB_REF'] != 'refs/tags/' + tag or os.environ['GITHUB_WORKFLOW_REF'] != expected:
              raise SystemExit('Run the release from its tag (gh workflow run release.yml --ref ' + tag + '), not from '
                               + os.environ['GITHUB_WORKFLOW_REF'] + ', so the signature names ' + expected)
          PY
      # A tag push has no inputs and always builds both images.
      - name: Select images
        id: images
        env:
          RELEASE_IMAGES: ${{ github.event_name == 'push' && 'both' || inputs.images }}
        run: |
          case "$RELEASE_IMAGES" in
            both) printf 'server=true\nworker=true\n' >> "$GITHUB_OUTPUT" ;;
            server) printf 'server=true\nworker=false\n' >> "$GITHUB_OUTPUT" ;;
            worker) printf 'server=false\nworker=true\n' >> "$GITHUB_OUTPUT" ;;
            *) echo 'images must be both, server or worker' >&2; exit 1 ;;
          esac
          echo "Selected images: $RELEASE_IMAGES"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_source_sha || github.sha }}
          persist-credentials: false
      - name: Resolve tag and verify checked-out package
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.version_tag || github.ref_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          tag = os.environ['RELEASE_TAG']
          expected = os.environ['EXPECTED_SOURCE_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          remote = subprocess.check_output(['git', 'ls-remote', '--exit-code', 'origin', 'refs/tags/' + tag, 'refs/tags/' + tag + '^{}'], text=True, timeout=60)
          refs = {}
          for line in remote.splitlines():
              fields = line.split()
              if len(fields) != 2 or not re.fullmatch('[a-f0-9]{40}', fields[0]) or fields[1] in refs:
                  raise SystemExit('Malformed or duplicate actual tag reference')
              refs[fields[1]] = fields[0]
          allowed = {'refs/tags/' + tag, 'refs/tags/' + tag + '^{}'}
          if 'refs/tags/' + tag not in refs or not set(refs).issubset(allowed):
              raise SystemExit('The exact existing version tag is missing')
          resolved = refs.get('refs/tags/' + tag + '^{}', refs['refs/tags/' + tag])
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          if actual != expected or resolved != expected or version != tag[1:]:
              raise SystemExit('Tag, checked-out source or package version differs')
          receipt = {'version': 1, 'releaseTag': tag, 'source': actual, 'packageVersion': version,
                     'workflowSource': os.environ['GITHUB_WORKFLOW_SHA'], 'workflowRef': os.environ['GITHUB_WORKFLOW_REF'],
                     'event': os.environ['GITHUB_EVENT_NAME'], 'actualTagRefs': refs}
          pathlib.Path('release-source.actual.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source=' + actual + '\nversion=' + version + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: release-source.actual.json
          if-no-files-found: error

  # Multi-arch (amd64 + arm64): the edge story is Rancher-managed k3s, and
  # edge nodes are frequently ARM — an amd64-only manifest is an instant
  # ImagePullBackOff snag there. All runtime deps ship linux-arm64 builds
  # (resvg native binary; jsdom/pg are pure JS).
  #
  # Each platform builds on its own native runner and pushes by digest only;
  # server-manifest then joins the two digests under the version tags and
  # signs the result. The Dockerfile runs TypeScript during the build, and
  # Node's type stripper failed under QEMU arm64 emulation (Work 1.1.1,
  # run 38796350202), so this image no longer uses QEMU.
  server-image:
    name: server image (${{ matrix.arch }})
    needs: release-source
    if: needs.release-source.outputs.server == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-source.outputs.source }}
          persist-credentials: false
      - name: Verify exact build source
        env:
          RELEASE_SOURCE: ${{ needs.release-source.outputs.source }}
          RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          node -e 'if (JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version !== process.env.RELEASE_VERSION) process.exit(1)'

      # Use the repository-scoped Actions token, as recommended for GHCR.
      # Releases use no personal access token.
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The push carries no tag. The pushed digest names a one-platform index
      # that holds the image and its SBOM + provenance attestation manifest.
      - name: Build and push by digest (with SBOM + provenance attestations)
        env:
          RELEASE_SOURCE: ${{ needs.release-source.outputs.source }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/lolly-work-server"
          docker buildx build --platform "$PLATFORM" \
            --provenance=mode=max --sbom=true \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_SOURCE" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            -f deploy/compose/Dockerfile .
          DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-metadata.json")
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
          echo "$PLATFORM pushed as $IMAGE@$DIGEST"

      # overwrite lets a rerun of one platform replace its earlier digest.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true

  server-manifest:
    name: server image (merge and sign)
    needs: [release-source, server-image]
    if: needs.release-source.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign keyless signing exchanges the workflow's OIDC identity for a
      # short-lived certificate - no key to store, nothing to leak (plans/36 §4).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-source.outputs.source }}
          persist-credentials: false
      - name: Verify exact build source
        env:
          RELEASE_SOURCE: ${{ needs.release-source.outputs.source }}
          RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          node -e 'if (JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version !== process.env.RELEASE_VERSION) process.exit(1)'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      # Keep the same repository-scoped token as the build jobs.
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # deploy/helm/values.yaml image.repository matches this push target
      # (ghcr.io/lolly-tools/lolly-work-server) under the lolly-tools org, and
      # the chart's empty image.tag defaults to appVersion — kept in sync with
      # package.json "version", so `helm install` pulls exactly this build.
      #
      # imagetools create copies every entry of both one-platform indexes into
      # one new index, attestation manifests included. check-index.py stops
      # the job unless the index has exactly linux/amd64 and linux/arm64, each
      # with an attestation manifest that holds an SPDX SBOM and SLSA
      # provenance. It checks the dry run before any tag moves, then the
      # pushed index.
      - name: Create the multi-platform index (amd64 + arm64)
        env:
          RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/lolly-work-server"
          VERSION="$RELEASE_VERSION"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          test "$(find "$RUNNER_TEMP/digests" -type f | wc -l)" -eq 2
          AMD64_DIGEST=$(cat "$RUNNER_TEMP/digests/amd64")
          ARM64_DIGEST=$(cat "$RUNNER_TEMP/digests/arm64")
          [[ "$AMD64_DIGEST" =~ ^sha256:[a-f0-9]{64}$ && "$ARM64_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          cat > "$RUNNER_TEMP/check-index.py" <<'PY'
          import json, subprocess, sys
          image, index = sys.argv[1], json.load(sys.stdin)
          platforms, attestations = {}, []
          for entry in index.get('manifests', []):
              notes = entry.get('annotations') or {}
              if notes.get('vnd.docker.reference.type') == 'attestation-manifest':
                  attestations.append((notes.get('vnd.docker.reference.digest'), entry['digest']))
                  continue
              platform = entry.get('platform') or {}
              name = platform.get('os', '') + '/' + platform.get('architecture', '')
              if name in platforms:
                  raise SystemExit('Duplicate platform in the index: ' + name)
              platforms[name] = entry['digest']
          if sorted(platforms) != ['linux/amd64', 'linux/arm64']:
              raise SystemExit('The index must hold exactly linux/amd64 and linux/arm64, found ' + ', '.join(sorted(platforms)))
          subjects = dict(attestations)
          if len(attestations) != 2 or sorted(subjects) != sorted(platforms.values()):
              raise SystemExit('Each platform image needs exactly one attestation manifest')
          for name, subject in sorted(platforms.items()):
              raw = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', '--raw', image + '@' + subjects[subject]], text=True)
              kinds = {(layer.get('annotations') or {}).get('in-toto.io/predicate-type', '') for layer in json.loads(raw).get('layers', [])}
              if 'https://spdx.dev/Document' not in kinds or not any(kind.startswith('https://slsa.dev/provenance/') for kind in kinds):
                  raise SystemExit('The attestation manifest for ' + name + ' lacks an SPDX SBOM or SLSA provenance')
              print(name, subject, 'attested by', subjects[subject])
          PY
          docker buildx imagetools create --dry-run -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST" > "$RUNNER_TEMP/index.dry-run.json"
          python3 "$RUNNER_TEMP/check-index.py" "$IMAGE" < "$RUNNER_TEMP/index.dry-run.json"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > "$RUNNER_TEMP/index.pushed.json"
          python3 "$RUNNER_TEMP/check-index.py" "$IMAGE" < "$RUNNER_TEMP/index.pushed.json"

      # Keyless signature over the pushed index digest - verifiable against
      # this workflow's identity at the release tag, no signing key anywhere:
      #   cosign verify "ghcr.io/lolly-tools/lolly-work-server@<digest>" \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity "https://github.com/lolly-tools/lolly-work/.github/workflows/release.yml@refs/tags/v<version>"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ printf "%s" .Manifest.Digest }}')
          cosign sign "$IMAGE@$DIGEST"
      # The job fails unless the new signature verifies against the exact
      # identity operators are told to require.
      - name: Verify the signature with the release identity
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ printf "%s" .Manifest.Digest }}')
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/v$VERSION" > /dev/null
          echo "Verified $IMAGE@$DIGEST as $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/v$VERSION"

  render-worker-image:
    name: render-worker image
    needs: release-source
    if: needs.release-source.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Same keyless cosign signing as server-manifest.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-source.outputs.source }}
          persist-credentials: false
      - name: Verify exact build source
        env:
          RELEASE_SOURCE: ${{ needs.release-source.outputs.source }}
          RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          node -e 'if (JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version !== process.env.RELEASE_VERSION) process.exit(1)'

      # Keep the same repository-scoped token as the server job.
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Multi-arch like the server (Playwright ships linux-arm64 Chromium).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build context is workers/render itself (see its Dockerfile header).
      # deploy/helm/values.yaml renderWorker.image.repository already points at
      # ghcr.io/lolly-tools/lolly-work-render-worker, which matches this under
      # the lolly-tools org.
      - name: Build and push (amd64 + arm64, with SBOM + provenance attestations)
        env:
          RELEASE_SOURCE: ${{ needs.release-source.outputs.source }}
          RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/lolly-work-render-worker"
          VERSION="$RELEASE_VERSION"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_SOURCE" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push workers/render

      # Same keyless signature as the server image - one verify recipe covers both.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ printf "%s" .Manifest.Digest }}')
          cosign sign "$IMAGE@$DIGEST"
      - name: Verify the signature with the release identity
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ printf "%s" .Manifest.Digest }}')
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/v$VERSION" > /dev/null
          echo "Verified $IMAGE@$DIGEST as $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/v$VERSION"
