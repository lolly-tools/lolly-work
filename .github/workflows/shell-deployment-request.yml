# SPDX-License-Identifier: MPL-2.0
name: Prepare shell deployment request
run-name: Prepare ${{ inputs.tier }} shell ${{ inputs.source }}
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact Lolly main commit (40 characters)
        required: true
      ci_run:
        description: Lolly CI run ID for this main commit
        required: true
      ci_attempt:
        description: Exact CI attempt
        default: '1'
        required: true
      tier:
        description: Qualification tier
        type: choice
        options: [public-ready, release-ready]
        default: public-ready
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: lolly-shell-request
  cancel-in-progress: true
jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify provider qualification and current main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          CI_RUN: ${{ inputs.ci_run }}
          CI_ATTEMPT: ${{ inputs.ci_attempt }}
          TIER: ${{ inputs.tier }}
        run: python3 -B scripts/verify-shell-qualification.py --source "$SOURCE" --run-id "$CI_RUN" --attempt "$CI_ATTEMPT" --tier "$TIER" --out "$RUNNER_TEMP/shell-request"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shell-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shell-request
          if-no-files-found: error
          retention-days: 7
      - name: Publication handoff
        run: echo 'Request verified. The private operator rechecks CI immediately before publication; this workflow has no production credentials.' >> "$GITHUB_STEP_SUMMARY"
