# SPDX-License-Identifier: MPL-2.0
# Appliance image: build the Lolly appliance (openSUSE Leap 16.1 Immutable)
# for x86_64 with KIWI, from deploy/appliance, in both runtime profiles (k3s,
# the default, and podman) side by side. Nothing is published; each raw disk is
# kept as a short-lived artifact for boot tests. The aarch64 builds and the
# boot acceptance run outside CI (deploy/appliance/README.md, "Build",
# "Boot and accept").
#
# KIWI needs loop devices, so the build runs in a privileged openSUSE Leap 16.1
# container on the runner. Like SUSE container qualification, it keeps its own
# path-filtered pull request trigger and is not part of PR qualification's
# `required` check.
name: Appliance image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/appliance.yml'
      - 'deploy/appliance/**'
      - 'deploy/marketplaces/release.json'
      - 'deploy/helm/**'
      - 'tests/appliance.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/appliance.yml'
      - 'deploy/appliance/**'
      - 'deploy/marketplaces/release.json'
      - 'deploy/helm/**'
      - 'tests/appliance.test.ts'

permissions:
  contents: read

concurrency:
  group: appliance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64:
    name: x86_64 ${{ matrix.profile }} raw and qcow2
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        profile: [k3s, podman]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.11.1'
      - name: Check the description and the generator
        run: node --test tests/appliance.test.ts
      - name: Make room for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build with KIWI in a privileged Leap 16.1 container
        env:
          PROFILE: ${{ matrix.profile }}
          # openSUSE's Leap 16.1 image, pinned on its own registry and on Docker Hub,
          # which runners reach when registry.opensuse.org times out.
          BUILDER: registry.opensuse.org/opensuse/leap@sha256:65a21515d62c7af67808e7aef29e0bcfdb609d95f9fe811fad7649d56c4b3dfa
          BUILDER_MIRROR: docker.io/opensuse/leap@sha256:756634f02c733fc52d5c9aa09aca6374c91c53c675dd445743736e13a8428858
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/cache"
          pulled=
          for attempt in 1 2 3; do
            if docker pull --quiet "$BUILDER"; then pulled=$BUILDER; break; fi
            if docker pull --quiet "$BUILDER_MIRROR"; then pulled=$BUILDER_MIRROR; break; fi
            sleep 20
          done
          [ -n "$pulled" ] || exit 1
          BUILDER=$pulled
          echo "builder image: $BUILDER"
          docker run --rm --privileged -v /dev:/dev -e PROFILE \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/out:/out" -v "$RUNNER_TEMP/cache:/var/cache/lolly-appliance" \
            "$BUILDER" \
            bash -euo pipefail -c '
              zypper --non-interactive --gpg-auto-import-keys refresh >/dev/null
              zypper --non-interactive install --no-recommends python3-kiwi kiwi-systemdeps-disk-images \
                kiwi-systemdeps-filesystems kiwi-systemdeps-bootloaders createrepo_c dosfstools mtools >/dev/null
              kiwi-ng --version
              /src/deploy/appliance/build.sh --profile "$PROFILE" --out /out --work /var/tmp/lolly-appliance
            '
      - name: Check the disk
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          cd "$RUNNER_TEMP/out"
          ls -la
          sha256sum -c SHA256SUMS
          # The image carries the release's Lolly version, never its own.
          version=$(node -p "require('$GITHUB_WORKSPACE/deploy/marketplaces/release.json').version")
          case $PROFILE in
            k3s) raw=lolly-appliance-$version-x86_64.raw ;;
            podman) raw=lolly-appliance-podman-$version-x86_64.raw ;;
          esac
          base=${raw%.raw}
          test -f "$raw" && test -f "$base.qcow2"
          grep -q "\"version\": \"$version\"" "$base.release.json"
          grep -q "\"profile\": \"$PROFILE\"" "$base.release.json"
          sudo sfdisk --dump "$raw" | tee "$RUNNER_TEMP/partitions.txt"
          # The config partition Combustion and Ignition read at first boot.
          grep -q 'name="p.lxconfig"' "$RUNNER_TEMP/partitions.txt"
          common='cockpit|cockpit-tukit|cosign|ignition|combustion|transactional-update|health-checker|rebootmgr|podman'
          for package in ${common//|/ }; do grep -qE "^$package\|" "$base.packages" || { echo "missing $package"; exit 1; }; done
          # Each profile carries only its own runtime's packages.
          case $PROFILE in
            k3s) wanted=k3s-selinux unwanted=cockpit-podman ;;
            podman) wanted=cockpit-podman unwanted=k3s-selinux ;;
          esac
          grep -qE "^$wanted\|" "$base.packages" || { echo "missing $wanted"; exit 1; }
          if grep -qE "^$unwanted\|" "$base.packages"; then echo "$unwanted does not belong in the $PROFILE profile"; exit 1; fi
      - name: Compress the raw disk
        # The qcow2 holds the same disk; keeping only the raw one halves the upload.
        run: |
          cd "$RUNNER_TEMP/out"
          for disk in lolly-appliance-*.raw; do zstd -T0 -10 "$disk" -o "$disk.zst"; done
          sudo rm -f lolly-appliance-*.raw lolly-appliance-*.qcow2
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lolly-appliance-x86_64-${{ matrix.profile }}
          path: ${{ runner.temp }}/out
          retention-days: 3
          compression-level: 0
