# Quality gate — runs on every push to main and every PR.
# Independent gates run in parallel; every one exits non-zero on failure and BLOCKS:
#   test       — full suite under Node 24, with a postgres:17 service so the
#                gated store conformance run (tests/store-postgres.test.ts)
#                actually executes instead of skipping. `pretest` re-verifies
#                the vendored engine pin (MPL "consumed unmodified" check).
#                The packaged Vercel function also boots and renders in CI.
#   typecheck  — tsc --noEmit across the repo.
#   audit      — npm audit on production deps (blocks on HIGH/CRITICAL) + SBOM
#                freshness (regenerate sbom.cdx.json, fail on drift - advisory
#                only on a dependabot[bot] PR, which cannot carry the
#                regenerated file; sbom-refresh.yml repairs main after the
#                merge).
#   package    — server and render-worker container images must build;
#                nothing is pushed here, release.yml does that.
# CI qualifies source and optional deployment adapters; it does not deploy.
# Production releases use the reviewed UpCloud/K3s deployment handoff.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel an in-flight run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Disposable Postgres for the store conformance suite. The test drops and
    # recreates the `public` schema itself, then runs the migrations runner —
    # the service only has to provide an empty lollywork_test database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lollywork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Full test suite (postgres store un-skipped)
        env:
          # tests/store-postgres.test.ts gates on this exact variable; without
          # it the conformance run skips silently and the gate is not real.
          LW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lollywork_test
        run: pnpm test

      - name: Build and exercise the packaged Vercel function
        run: |
          pnpm run build:vercel
          pnpm run check:vercel

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The worker keeps its own package.json (playwright-core lives there, not
      # in the root tree — the plane never imports it). Its tests import
      # workers/render/src/server.ts, which pulls the worker into the root tsc
      # project, so its types must be installed for typecheck to see them.
      - name: Install worker deps
        run: pnpm -C workers/render install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

  audit:
    name: npm audit (high+critical) + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit — block on high/critical (production deps only)
        run: pnpm audit --prod --audit-level=high

      - name: Audit render worker dependencies
        run: pnpm -C workers/render audit --prod --audit-level=high

      - name: Full advisory report (non-blocking, for the log)
        if: always()
        run: pnpm audit || true

      # The committed SBOM is generated from pnpm-lock.yaml (scripts/build-sbom.ts,
      # deterministic). Regenerate it here and fail on drift, so the SBOM can't go
      # stale against the installed graph.
      #
      # One exception, and only one: Dependabot's own PRs. A bump changes the
      # lockfile, so the SBOM moves, but Dependabot commits nothing except the
      # lockfile and the manifest - it cannot carry a regenerated artifact, and
      # nobody can add one to its branch without taking the PR over by hand.
      # Failing here would park every bump forever (or, worse, train us to merge
      # red). So on a dependabot[bot] PR the drift is reported as a warning and the
      # job carries on; main repairs itself right after the merge via
      # .github/workflows/sbom-refresh.yml, which regenerates and commits
      # sbom.cdx.json on push.
      #
      # For every other actor this is still a hard failure: a human who touches the
      # lockfile commits the regenerated SBOM alongside it, same as before.
      #
      # github.actor is the actor of THIS run, not the PR author, so a human who
      # re-runs a Dependabot PR's jobs turns the warning back into a failure for
      # that run. Harmless (merge still needs the queue's green run, and main
      # repairs itself either way), but it looks arbitrary if you hit it without
      # knowing why.
      - name: SBOM up to date (regenerate; fail on drift, warn for Dependabot)
        env:
          SBOM_DRIFT_ADVISORY: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          pnpm run sbom
          if git diff --quiet -- sbom.cdx.json; then
            echo "sbom.cdx.json matches the dependency graph."
            exit 0
          fi
          git --no-pager diff --stat -- sbom.cdx.json
          if [ "$SBOM_DRIFT_ADVISORY" = 'true' ]; then
            echo "::warning title=SBOM drift (advisory for Dependabot)::sbom.cdx.json is stale for this bump. sbom-refresh.yml regenerates and commits it on main once this merges."
            exit 0
          fi
          echo "::error title=SBOM drift::sbom.cdx.json is stale. Run pnpm run sbom and commit the result."
          exit 1

  # Packaging gate — both deployment tiers must build on every change.
  # Build only, no registry login, nothing pushed.
  package:
    name: container image builds (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: deploy/compose/Dockerfile
            context: .
          - image: render-worker
            dockerfile: workers/render/Dockerfile
            context: workers/render
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (no push)
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --file ${{ matrix.dockerfile }} --tag lolly-${{ matrix.image }}:ci \
            --label org.opencontainers.image.revision=$GITHUB_SHA \
            --output type=docker --output "type=oci,dest=$RUNNER_TEMP/${{ matrix.image }}.oci.tar" \
            ${{ matrix.context }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.image == 'render-worker'
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.image == 'render-worker'
        with:
          node-version: '24.21.0'
      - name: Read matched Lolly source
        if: matrix.image == 'render-worker'
        id: matched-shell
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const pin = JSON.parse(readFileSync('engine-pin.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(pin.generatedFrom)) throw new Error('Invalid matched Lolly source');
          console.log('source=' + pin.generatedFrom);
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.image == 'render-worker'
        with:
          repository: lolly-tools/lolly
          ref: ${{ steps.matched-shell.outputs.source }}
          path: qualification-lolly
          persist-credentials: false
      - name: Install qualification inputs from frozen locks
        if: matrix.image == 'render-worker'
        timeout-minutes: 15
        run: |
          pnpm install --frozen-lockfile
          pnpm -C qualification-lolly install --frozen-lockfile
      - name: Qualify built worker with matched signed shell and real browser
        if: matrix.image == 'render-worker'
        timeout-minutes: 25
        run: node scripts/qualify-render-worker-image.ts --lolly-root qualification-lolly --image lolly-render-worker:ci
      - name: Qualify native server rendering and release contracts
        if: matrix.image == 'server'
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=256m \
            --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 1 \
            --entrypoint node lolly-server:ci --input-type=module -e '
              import assert from "node:assert/strict";
              import { Resvg } from "@resvg/resvg-js";
              import sharp from "sharp";
              assert.equal(process.getuid(),1000); assert.equal(process.arch,"x64");
              const png=new Resvg("<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"13\" height=\"7\"><rect width=\"13\" height=\"7\" fill=\"green\"/></svg>").render().asPng();
              const metadata=await sharp(png).metadata();assert.equal(metadata.width,13);assert.equal(metadata.height,7);
              assert.ok((await sharp(png).jpeg().toBuffer()).length>0);
            '
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=256m \
            --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 1 \
            --entrypoint node lolly-server:ci scripts/verify-engine-pin.ts
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=256m \
            --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 1 \
            --entrypoint node lolly-server:ci scripts/check-release-capabilities.ts
      - name: Bind the booted image to its offline transport
        run: |
          docker image inspect lolly-${{ matrix.image }}:ci --format '{{json .}}' > "$RUNNER_TEMP/${{ matrix.image }}-image.json"
          sha256sum "$RUNNER_TEMP/${{ matrix.image }}.oci.tar" > "$RUNNER_TEMP/${{ matrix.image }}.oci.tar.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qualified-${{ matrix.image }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ matrix.image }}.oci.tar
            ${{ runner.temp }}/${{ matrix.image }}.oci.tar.sha256
            ${{ runner.temp }}/${{ matrix.image }}-image.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
