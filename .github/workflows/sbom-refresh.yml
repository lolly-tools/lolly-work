# SBOM refresh - keeps the committed CycloneDX SBOM in step with main.
#
# WHY THIS EXISTS
# sbom.cdx.json is a GENERATED artifact (scripts/build-sbom.ts) describing the
# third-party npm packages the control plane ships, derived from pnpm-lock.yaml
# plus the license map in security/npm-licenses.json. CI's audit job regenerates
# it and fails on drift, so a stale SBOM cannot ship.
#
# That gate has one blind spot, and Dependabot lives in it. A bump PR changes a
# lockfile, so the SBOM moves - but Dependabot only ever commits the lockfile and
# the manifest, never a regenerated artifact, and nobody can add one to its
# branch without taking the PR over by hand. The result was every bump PR red on
# this one check (PR #10 failed on nothing else), which either parks the queue
# forever or trains us to merge red. So the drift is repaired at the source: on
# main, straight after the bump merges, by the job below. The matching half of
# the deal is in ci.yml, where the drift check is advisory (a warning) for
# dependabot[bot] and still fatal for everyone else - a human who edits a
# lockfile still commits the SBOM with it.
#
# WHAT IT DOES
# Regenerates sbom.cdx.json on main and, if it changed, commits just that file
# back to main with GITHUB_TOKEN. A commit pushed with GITHUB_TOKEN does NOT
# trigger workflows, which is what we want here: no second CI run, no Vercel
# deploy from ci.yml's push-to-main job, and no chance of this job retriggering
# itself. The trade is that the refresh commit is not itself gated by CI, which
# is acceptable because it is machine-generated, one path wide, and reproducible
# by anyone running `pnpm run sbom`.
#
# main is unprotected today (checked 2026-09-12), so the push succeeds. If branch
# protection is ever turned on here, GITHUB_TOKEN needs an explicit bypass for
# this workflow, or the refresh has to open a PR instead of pushing - otherwise
# the job goes red on every rejected push and the drift comes back.
#
# TRIGGERS
# Path-filtered to the generator's actual inputs, so an ordinary docs or source
# push to main does not pay for a pnpm install. If an input is ever missed, the
# only symptom is the old behaviour (drift caught by the audit job), and
# workflow_dispatch runs the refresh by hand.
name: SBOM refresh

on:
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'security/npm-licenses.json'
      - 'scripts/build-sbom.ts'
      - 'scripts/lib/pnpm-lock.ts'
      - '.github/workflows/sbom-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a run that may be mid-commit, and never run two at once: a second
# push queues behind the first, then regenerates on top of its result.
concurrency:
  group: sbom-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: regenerate sbom.cdx.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm

      # build-sbom reads the lockfile off disk rather than a resolved
      # node_modules tree, but it falls back to each installed package's own
      # package.json for licenses the lockfile does not carry, so the install is
      # real and must be the frozen one.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Regenerate, and commit only if the file actually moved. A direct push to
      # main can arrive between the checkout and our push, so a rejected push
      # resets to the new main and regenerates there rather than force-pushing
      # over it. Three attempts, then fail loudly: a persistent rejection is a
      # real signal, not something to loop on.
      - name: Regenerate the SBOM and commit it if it moved
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            pnpm run sbom || exit 1
            if git diff --quiet -- sbom.cdx.json; then
              echo "sbom.cdx.json already matches the dependency graph - nothing to commit."
              exit 0
            fi
            git --no-pager diff --stat -- sbom.cdx.json
            git add sbom.cdx.json
            git commit --file=- <<'MSG' || exit 1
          SBOM: regenerate after a dependency change on main

          Generated by .github/workflows/sbom-refresh.yml (pnpm run sbom). The
          committed CycloneDX SBOM is derived from pnpm-lock.yaml, so a bump
          that only touches a lockfile leaves it stale. This restores it, which
          keeps the audit job's drift gate meaningful for the next PR.
          MSG
            if git push origin HEAD:main; then
              echo "Committed a refreshed sbom.cdx.json to main (attempt ${attempt})."
              exit 0
            fi
            echo "::notice::main moved under us; rebuilding on the new tip (attempt ${attempt})."
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error title=SBOM refresh could not push::main kept moving; run pnpm run sbom and commit sbom.cdx.json by hand."
          exit 1
