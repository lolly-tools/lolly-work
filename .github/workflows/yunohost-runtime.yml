# SPDX-License-Identifier: MPL-2.0
name: YunoHost installation qualification

# Run only after both immutable source archives are published and the package
# mirror has their generated checksums. This never contacts a Lolly instance.
on:
  workflow_dispatch:
    inputs:
      package_commit:
        description: Full reviewed commit in lolly-tools/lolly-work_ynh
        required: true
        type: string
      package_version:
        description: Exact package version, for example 1.1.0~ynh3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yunohost-installation-qualification
  cancel-in-progress: false

jobs:
  installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PACKAGE_COMMIT: ${{ inputs.package_commit }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      YNHDEV_BACKEND: incus
      ARCH: amd64
      DIST: bookworm
      YNH_BRANCH: stable
    steps:
      - name: Validate immutable package selection
        run: |
          [[ "$PACKAGE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+~ynh[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lolly-tools/lolly-work_ynh
          ref: ${{ inputs.package_commit }}
          path: .qualification/package
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: YunoHost/package_check
          ref: f7d32cadac3cfced282decede024707fba9e6ec6
          path: .qualification/package_check
          persist-credentials: false
      - name: Verify the package manifest
        run: |
          test "$(git -C .qualification/package rev-parse HEAD)" = "$PACKAGE_COMMIT"
          python3 - <<'PY'
          import os, pathlib, tomllib
          manifest = tomllib.loads(pathlib.Path('.qualification/package/manifest.toml').read_text())
          if manifest['id'] != 'lolly-work' or manifest['version'] != os.environ['PACKAGE_VERSION']:
              raise SystemExit('The selected package identity/version differs')
          PY
      - name: Prepare disposable Incus runner
        run: |
          sudo apt-get update
          sudo apt-get install -y incus btrfs-progs lynx jq python3-pip python3-venv python3-toml \
            python3-pycurl python3-bs4 python3-lxml python3-jsonschema \
            python3-packaging python3-pyparsing python3-six iputils-ping curl
          # Ubuntu 24.04 does not package imgkit. Keep distro-managed dependencies
          # and install its reviewed pure-Python wheel in an isolated environment.
          /usr/bin/python3 -m venv --system-site-packages .qualification/python
          printf '%s\n' 'imgkit==1.2.3 --hash=sha256:cba8e3f67da6e0a5c87345a8b41605337851f9b9b75719500fa6810ecff84791' \
            > .qualification/imgkit-requirements.txt
          .qualification/python/bin/python -m pip install --no-deps --only-binary=:all: \
            --require-hashes -r .qualification/imgkit-requirements.txt
          .qualification/python/bin/python -c 'import imgkit, toml, pycurl, bs4, lxml, jsonschema, packaging, pyparsing, six'
          echo "$GITHUB_WORKSPACE/.qualification/python/bin" >> "$GITHUB_PATH"
          # Docker's forwarding policy conflicts with the official Incus checker.
          # This is an ephemeral hosted runner, never a production host.
          sudo systemctl stop docker.service docker.socket
          sudo iptables -P FORWARD ACCEPT
          sudo modprobe btrfs
          sudo usermod -aG incus-admin "$USER"
          sudo incus admin init --auto --storage-backend=btrfs --storage-create-loop=20
          mkdir -p .qualification/results
          cat > .qualification/run-package-check.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.qualification/python/bin:$PATH"
          test "$(command -v python3)" = "$GITHUB_WORKSPACE/.qualification/python/bin/python3"
          python3 -c 'import imgkit, importlib.metadata; assert importlib.metadata.version("imgkit") == "1.2.3"'
          cd "$GITHUB_WORKSPACE/.qualification/package_check"
          # The detached checker remains at the reviewed commit. Its official
          # linter updater records the actual linter revision in the result set.
          test "$(git rev-parse HEAD)" = f7d32cadac3cfced282decede024707fba9e6ec6
          test "$(git rev-parse --abbrev-ref HEAD)" = HEAD
          python3 - <<'PY'
          import difflib, hashlib, json, os, pathlib
          common = pathlib.Path('lib/common.sh')
          original = common.read_bytes()
          expected = 'ca512f2e5cea6bba470ecf5989b7024496559c4ffb84dd181cb1d345c36c60cc'
          old = b'assert_we_are_connected_to_the_internets() {\n    ping -q -c 2 yunohost.org > /dev/null 2>&1 \\\n    || ping -q -c 2 framasoft.org > /dev/null 2>&1 \\\n    || log_critical "Unable to connect to internet."\n}\n'
          replacement = b'assert_we_are_connected_to_the_internets() {\n    # GitHub Azure runners can block ICMP. Preserve real ping diagnostics,\n    # then require actual TLS-verified HTTP200 and the needed image index.\n    local proof="$GITHUB_WORKSPACE/.qualification/results"\n    local rc=0\n    mkdir -p "$proof"\n    command -v ping > "$proof/ping-command.original" 2> "$proof/ping-command.stderr" || rc=$?\n    printf \'%s\\n\' "$rc" > "$proof/ping-command.exit"\n    rc=0\n    timeout 8s ping -q -c 2 -W 3 yunohost.org > "$proof/ping-yunohost.stdout" 2> "$proof/ping-yunohost.stderr" || rc=$?\n    printf \'%s\\n\' "$rc" > "$proof/ping-yunohost.exit"\n    rc=0\n    timeout 8s ping -q -c 2 -W 3 framasoft.org > "$proof/ping-framasoft.stdout" 2> "$proof/ping-framasoft.stderr" || rc=$?\n    printf \'%s\\n\' "$rc" > "$proof/ping-framasoft.exit"\n    rc=0\n    /usr/bin/curl --fail --silent --show-error --location --proto \'=https\' --proto-redir \'=https\' \\\n        --connect-timeout 10 --max-time 30 --max-filesize 1048576 \\\n        --output "$proof/yunohost-image-index.original.json" \\\n        --write-out \'%{http_code} %{ssl_verify_result} %{size_download}\\n\' \\\n        https://repo.yunohost.org/incus/streams/v1/index.json \\\n        > "$proof/yunohost-curl.enums.original" 2> "$proof/yunohost-curl.stderr" || rc=$?\n    printf \'%s\\n\' "$rc" > "$proof/yunohost-curl.exit"\n    cat "$proof/yunohost-curl.enums.original" "$proof/yunohost-curl.stderr"\n    [[ "$rc" == 0 ]] || log_critical "Required YunoHost HTTPS connection failed."\n    local code tls count\n    read -r code tls count < "$proof/yunohost-curl.enums.original"\n    [[ "$code" == 200 && "$tls" == 0 ]] || log_critical "Required YunoHost HTTPS status or TLS verification failed."\n    python3 -c \'import json, pathlib, sys; b=pathlib.Path(sys.argv[1]).read_bytes(); assert 0<len(b)<=1048576 and len(b)==int(sys.argv[2]); v=json.loads(b); i=v["index"]["images"]; assert v["format"]=="index:1.0" and i["datatype"]=="image-downloads" and i["format"]=="products:1.0" and i["path"]=="streams/v1/images.json" and "yunohost:bookworm-stable:appci:amd64" in i["products"]; print("Verified required YunoHost HTTPS image index")\' "$proof/yunohost-image-index.original.json" "$count" \\\n        || log_critical "Required YunoHost HTTPS image index is invalid."\n}\n'
          if hashlib.sha256(original).hexdigest() != expected or original.count(old) != 1:
              raise SystemExit('Pinned checker common.sh or startup guard differs')
          modified = original.replace(old, replacement)
          proof = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.qualification/results'
          proof.mkdir(parents=True, exist_ok=True)
          (proof / 'checker-common.pinned.original.sh').write_bytes(original)
          (proof / 'checker-common.https-adapted.sh').write_bytes(modified)
          (proof / 'checker-startup-https.patch').write_text(''.join(difflib.unified_diff(original.decode().splitlines(True), modified.decode().splitlines(True), fromfile='a/lib/common.sh', tofile='b/lib/common.sh')))
          (proof / 'checker-compatibility.actual.json').write_text(json.dumps({'upstreamCommit': 'f7d32cadac3cfced282decede024707fba9e6ec6', 'originalSha256': expected, 'modifiedSha256': hashlib.sha256(modified).hexdigest(), 'onlyModifiedFunction': 'assert_we_are_connected_to_the_internets', 'reason': 'Declared GitHub Azure ICMP compatibility; actual bounded verified HTTPS required', 'installOrRecoveryQualified': False}, indent=2) + '\n')
          common.write_bytes(modified)
          print('Declared checker startup HTTPS adaptation; application checks unchanged')
          PY
          # The pinned checker's normal path assumes the documented YunoHost
          # remote already exists; only --rebuild initializes it itself.
          timeout 120s incus remote add yunohost https://repo.yunohost.org/incus --protocol simplestreams --public
          incus remote list --format json > "$GITHUB_WORKSPACE/.qualification/results/incus-remotes.before.original.json"
          timeout 120s incus image list yunohost:yunohost/bookworm-stable/appci --format json \
            > "$GITHUB_WORKSPACE/.qualification/results/incus-official-base.before.original.json"
          python3 - <<'PY'
          import json, os, pathlib, re
          proof = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.qualification/results'
          remotes = json.loads((proof / 'incus-remotes.before.original.json').read_text())
          remote = remotes['yunohost']
          if remote['Addr'] != 'https://repo.yunohost.org/incus' or remote['Protocol'] != 'simplestreams' or remote['Public'] is not True:
              raise SystemExit('The actual Incus remote differs from the official public HTTPS origin')
          images = json.loads((proof / 'incus-official-base.before.original.json').read_text())
          if not isinstance(images, list) or len(images) != 1:
              raise SystemExit('Expected exactly one official matching base image')
          image = images[0]
          alias = 'yunohost/bookworm-stable/appci'
          if image['architecture'] != 'x86_64' or image['type'] != 'container' or image['public'] is not True:
              raise SystemExit('Official image platform, type or visibility differs')
          if not any(row['name'] == alias for row in image['aliases']):
              raise SystemExit('Official base image alias is missing')
          if not re.fullmatch('[0-9a-f]{64}', image['fingerprint']):
              raise SystemExit('Official image fingerprint is not a complete SHA256')
          (proof / 'incus-official-base.selection.actual.json').write_text(json.dumps({'origin': remote['Addr'], 'protocol': remote['Protocol'], 'alias': alias, 'fingerprint': image['fingerprint'], 'architecture': image['architecture'], 'type': image['type'], 'public': image['public'], 'nativeAppInstallationQualified': False}, indent=2) + '\n')
          print('Actual official Incus base image available: ' + image['fingerprint'])
          PY
          # The published remote now uses slash aliases. Import its exact
          # selected fingerprint under the pinned checker's legacy local alias.
          base_fingerprint=$(python3 -c 'import json, os, pathlib; p=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/".qualification/results/incus-official-base.selection.actual.json"; print(json.loads(p.read_text())["fingerprint"])')
          timeout 900s incus image copy "yunohost:$base_fingerprint" local: --alias yunohost-bookworm-stable-appci
          incus image list "$base_fingerprint" --format json \
            > "$GITHUB_WORKSPACE/.qualification/results/incus-local-base.imported.original.json"
          python3 - <<'PY'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.qualification/results'
          selected = json.loads((proof / 'incus-official-base.selection.actual.json').read_text())
          images = json.loads((proof / 'incus-local-base.imported.original.json').read_text())
          if not isinstance(images, list) or len(images) != 1:
              raise SystemExit('Expected exactly one actual imported base image')
          image = images[0]
          legacy = 'yunohost-bookworm-stable-appci'
          if image['fingerprint'] != selected['fingerprint'] or image['architecture'] != selected['architecture'] or image['type'] != selected['type']:
              raise SystemExit('Actual imported image bytes or platform differ from selected official image')
          if image['public'] is not False or not any(row['name'] == legacy for row in image['aliases']):
              raise SystemExit('Expected private local compatibility alias is missing or has different visibility')
          (proof / 'incus-local-base.verified.actual.json').write_text(json.dumps({'origin': selected['origin'], 'remoteAlias': selected['alias'], 'localAlias': legacy, 'fingerprint': image['fingerprint'], 'architecture': image['architecture'], 'type': image['type'], 'remotePublic': selected['public'], 'localPublic': image['public'], 'sameGenuineImportedFingerprint': True, 'nativeAppInstallationQualified': False}, indent=2) + '\n')
          print('Actual full-fingerprint local base imported and verified: ' + image['fingerprint'])
          PY
          ./package_check.sh "$GITHUB_WORKSPACE/.qualification/package"
          SH
      - name: Run official install, upgrade, multiple-instance and recovery checks
        run: sg incus-admin -c 'bash "$GITHUB_WORKSPACE/.qualification/run-package-check.sh"'
      - name: Require actual successful installation and recovery results
        run: |
          # package_check itself can exit zero even when an app test fails.
          python3 - <<'PY'
          import json, os, pathlib
          result = json.loads(pathlib.Path('.qualification/package_check/results_0.json').read_text())
          if result['app'] != 'lolly-work' or result['architecture'] != 'amd64':
              raise SystemExit('Results identify a different app or architecture')
          if result['commit'] != os.environ['PACKAGE_COMMIT'] or result['app_version'] != os.environ['PACKAGE_VERSION']:
              raise SystemExit('Results do not identify the selected package')
          tests = result['tests']
          required = {('TEST_PACKAGE_LINTER', ''), ('TEST_INSTALL', 'root'),
                      ('TEST_INSTALL', 'multi'), ('TEST_UPGRADE', ''),
                      ('TEST_BACKUP_RESTORE', ''), ('TEST_CHANGE_URL', '')}
          observed = {(test['test_type'], test['test_arg']) for test in tests if test['test_serie'] == 'default'}
          if not required.issubset(observed):
              raise SystemExit('Required install, upgrade, recovery or URL-change evidence is missing')
          if any(test['main_result'] != 'success' for test in tests):
              raise SystemExit('An official package test failed')
          # Levels 1-5 cover install, upgrade, recovery and security/lint errors.
          # Level 6 requires ownership by YunoHost-Apps; our mirror is upstream.
          if any(result['level_results'].get(str(level)) is not True for level in range(1, 6)):
              raise SystemExit('Official installation/recovery/security checks did not pass')
          if any('<style=danger>' in note for test in tests for note in test.get('test_notes', [])):
              raise SystemExit('Official checks reported an unsafe runtime condition')
          print('The exact package passed the official YunoHost installation and recovery checks.')
          PY
      - name: Preserve checker versions and original logs
        if: always()
        run: |
          mkdir -p .qualification/results
          git -C .qualification/package rev-parse HEAD > .qualification/results/package-commit.txt
          git -C .qualification/package_check rev-parse HEAD > .qualification/results/checker-commit.txt
          if test -d .qualification/package_check/package_linter/.git; then
            git -C .qualification/package_check/package_linter rev-parse HEAD > .qualification/results/linter-commit.txt
          fi
          cp .qualification/package/manifest.toml .qualification/results/manifest.toml
          for report in results_0.json full_log_0.log summary_0.png; do
            if test -f ".qualification/package_check/$report"; then
              cp ".qualification/package_check/$report" .qualification/results/
            fi
          done
          sudo incus list --format=json > .qualification/results/incus-final.json || true
          sg incus-admin -c 'incus image list --format json' > .qualification/results/incus-local-images.final.original.json || true
          sg incus-admin -c 'incus remote list --format json' > .qualification/results/incus-remotes.final.original.json || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: yunohost-installation-${{ github.run_id }}
          path: .qualification/results/
          if-no-files-found: error
          retention-days: 14
