name: Admission service qualification
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish and sign the qualified adapter from main (never deploys)'
        type: boolean
        default: false
      source_sha:
        description: 'Exact reviewed main commit SHA; required when publishing'
        type: string
        default: ''
  pull_request:
    paths: ['services/admission/**', 'tests/admission-service.test.ts', '.github/workflows/admission-qualification.yml']
  push:
    branches: [main]
    paths: ['services/admission/**', 'tests/admission-service.test.ts', '.github/workflows/admission-qualification.yml']
permissions:
  contents: read
concurrency:
  group: admission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Admission protocol, boundaries and transfer guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admission
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: services/admission/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
  amd64:
    name: Admission amd64 image, TLS and restart qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install an isolated CI Redis fixture
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends redis-server
      - name: Build only the adapter, with Docker and OCI outputs from the same build
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --file services/admission/Dockerfile --tag lolly-admission:ci \
            --output type=docker --output "type=oci,dest=$RUNNER_TEMP/admission-amd64.oci.tar" services/admission
      - name: Boot the non-root read-only image against synthetic verified TLS
        run: node services/admission/test/container-smoke.mjs lolly-admission:ci
      - name: Verify the archive and bind the exact booted runtime config
        run: python3 services/admission/test/oci-evidence.py "$RUNNER_TEMP/admission-amd64.oci.tar" lolly-admission:ci "$RUNNER_TEMP/admission-amd64-evidence.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: admission-amd64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/admission-amd64.oci.tar
            ${{ runner.temp }}/admission-amd64-evidence.json
          retention-days: 7
          if-no-files-found: error
  publish:
    name: Explicit reviewed admission image publication
    needs: [unit, amd64]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Refuse an unreviewed main head
        env:
          REVIEWED_SHA: ${{ inputs.source_sha }}
        run: test "$REVIEWED_SHA" = "$GITHUB_SHA" && [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in with this workflow's package credential only
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish a source-bound tag, then qualify that exact digest
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lolly-admission"
          docker buildx build --platform linux/amd64 --provenance=mode=max --sbom=true \
            --file services/admission/Dockerfile --tag "$IMAGE:sha-$GITHUB_SHA" --push services/admission
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{ .Manifest.Digest }}')
          echo "ADMISSION_IMAGE=$IMAGE@$DIGEST" >> "$GITHUB_ENV"
          docker pull "$IMAGE@$DIGEST"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends redis-server
          node services/admission/test/container-smoke.mjs "$IMAGE@$DIGEST"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the boot-qualified digest using the workflow OIDC identity
        env:
          COSIGN_YES: 'true'
        run: cosign sign "$ADMISSION_IMAGE"
      - name: Record the published identity
        run: printf '%s\n' "$ADMISSION_IMAGE" >> "$GITHUB_STEP_SUMMARY"
