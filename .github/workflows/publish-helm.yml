# SPDX-License-Identifier: MPL-2.0
name: Publish official Helm chart

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full reviewed main commit with successful CI and Helm/deployment qualification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: official-helm-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lolly-tools/lolly-work' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Validate source selector
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: python3 -c 'import os,re; assert re.fullmatch("[a-f0-9]{40}",os.environ["EXPECTED_SOURCE_SHA"]), "Use a full reviewed source SHA"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.11.1'
      - run: pnpm install --frozen-lockfile
      - name: Install checksum-pinned Helm
        run: |
          curl -fsSL --retry 3 https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tgz"
          echo 'e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  '"$RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      - name: Package exact chart source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: node scripts/package-helm-chart.ts "$RUNNER_TEMP/chart" "$EXPECTED_SOURCE_SHA"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the chart archive
        run: |
          archive=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP+"/chart/chart-release.json")).archive')
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/chart/$archive.sigstore.json" "$RUNNER_TEMP/chart/$archive"
      - name: Publish immutable package and update HTTP repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTHUB_REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
          ARTIFACTHUB_OWNER_EMAIL: ${{ vars.ARTIFACTHUB_OWNER_EMAIL }}
        run: node scripts/publish-helm-chart.ts "$RUNNER_TEMP/chart"
      # The channel record changes through a reviewed pull request, so the run only
      # prints the command: failed for any unsuccessful run, checked publication otherwise.
      - name: Show the channel record command
        if: always()
        continue-on-error: true
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/marketplace-channels.ts helm-summary "$RUN_STATUS" "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
