# Deliberately unresolved digest: review/render/pin before staging.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission-adapter
  namespace: lolly-admission
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: lolly-admission, app.kubernetes.io/component: adapter}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lolly-admission, app.kubernetes.io/component: adapter}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: adapter
          image: registry.example.com/team/lolly-admission@sha256:REPLACE_WITH_QUALIFIED_DIGEST
          ports: [{name: https, containerPort: 8443}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 300m, memory: 128Mi}
          env:
            - {name: ADMISSION_TLS_KEY_FILE, value: /run/tls/tls.key}
            - {name: ADMISSION_TLS_CERT_FILE, value: /run/tls/tls.crt}
            - {name: ADMISSION_MCP_TOKEN_FILE, value: /run/tokens/mcp}
            - {name: ADMISSION_CA_TOKEN_FILE, value: /run/tokens/ca}
            - {name: ADMISSION_REDIS_URL_FILE, value: /run/redis/url}
            - {name: ADMISSION_REDIS_CA_FILE, value: /run/tls/redis-ca.crt}
          startupProbe:
            httpGet: {path: /livez, port: https, scheme: HTTPS}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /livez, port: https, scheme: HTTPS}
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
          volumeMounts:
            - {name: tls, mountPath: /run/tls, readOnly: true}
            - {name: tokens, mountPath: /run/tokens, readOnly: true}
            - {name: redis, mountPath: /run/redis, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls
          secret: {secretName: admission-adapter-tls, defaultMode: 0440}
        - name: tokens
          secret: {secretName: admission-bearer-tokens, defaultMode: 0440}
        - name: redis
          secret: {secretName: admission-redis-client, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: admission-adapter
  namespace: lolly-admission
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: lolly-admission, app.kubernetes.io/component: adapter}
  ports: [{name: https, port: 8443, targetPort: https}]
