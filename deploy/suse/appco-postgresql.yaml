# SPDX-License-Identifier: MPL-2.0
# Optional, separate database release; see appco-postgresql.lock.json and README.
# This is a rendered candidate, not a tested database migration or HA claim.
# Required existing namespace Secrets: application-collection, lolly-postgres-auth,
# and lolly-postgres-tls. Review storageClassName and resource sizes for your host.
global:
  imagePullSecrets:
    - application-collection

images:
  postgresql:
    registry: dp.apps.rancher.io
    repository: containers/postgresql
    tag: "18.6-16.3"
    digest: "sha256:24210933acadcefb3775a122818d5d3b888fe5b2687eaa5b0e0867bd82a211d6"

nodeCount: 1
auth:
  # Create the destination explicitly with builtin C.UTF-8; see POSTGRESQL-REHEARSAL.md.
  database: ""
  username: lollywork
  existingSecret: lolly-postgres-auth
  passwordKey: password
  postgresPasswordKey: postgresPassword
  replicationPasswordKey: replicationPassword

tls:
  enabled: true
  existingSecret: lolly-postgres-tls
  certFilename: server.crt
  keyFilename: server.key
  caCertFilename: ca.crt

metrics:
  enabled: false

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 16Gi

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

podTemplates:
  volumes:
    socket:
      enabled: true
      emptyDir:
        sizeLimit: 8Mi
  containers:
    postgresql:
      volumeMounts:
        socket:
          enabled: true
          mountPath: /run/postgresql
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 128Mi
        limits:
          cpu: "1"
          memory: 1Gi
          ephemeral-storage: 1Gi
