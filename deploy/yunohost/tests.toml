#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/tests.v1.schema.json

test_format = 1.0

[default]

    # The app takes a whole domain (manifest: no install.path question),
    # so the sub-path install test does not apply. The rest is deduced from the
    # manifest: root install, multi-instance, backup/restore, upgrade, change_url.
    exclude = ["install.subdir"]

    [default.test_upgrade_from."583cdc4af5322e683991a548428859b79084db2d"]
    name = "1.1.0~ynh3"

    [default.test_upgrade_from."1104e55c1a91d2d4d0a411ea3798c0a0b37ae396"]
    name = "1.2.0~ynh2"
