# Lolly Work - one whole domain (full_domain), reverse-proxied to the Node server.
# Included INSIDE the domain's server block; placeholders (__DOMAIN__ and
# __APP__) are substituted by ynh_config_add_nginx. The proxy directives live in
# a sibling .inc (proxy.inc) so every location hands off identically, and the
# shell's header set in another (.inc keeps them out of the domain's *.conf glob).
#
# Why several locations for one upstream: headers. A YunoHost domain sets a
# baseline header set at server level with `more_set_headers` (HSTS,
# X-Frame-Options, a permissive Content-Security-Policy, Referrer-Policy
# same-origin). Those directives run on every location's response, after the
# upstream has answered, and for a header the upstream also sent the server-level
# value REPLACES it - including the strict per-route Content-Security-Policy the
# control plane sends on its sign-in, share and activation pages. A location-level
# directive runs later still, so each location below sets the last word: the
# shell's own policy on /, and on the control plane's routes the upstream's CSP
# put back from $upstream_http_content_security_policy (an empty value clears the
# header, so a route that sends none ends with none). Referrer-Policy is
# no-referrer everywhere: render and share URLs carry their inputs. Verified
# against nginx 1.22 + headers-more on Debian 12 (YunoHost 12).

# The web shell at /: static-app headers, same policy as lolly.tools.
location / {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.shell-headers.inc;
    include conf.d/yunohost_panel.conf.inc;
}

# The control plane's own routes: the upstream's Content-Security-Policy put back.
location ^~ /api/ {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: no-referrer";
}
location ^~ /admin {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: no-referrer";
    include conf.d/yunohost_panel.conf.inc;
}
location ^~ /activate {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: no-referrer";
}
location ^~ /l/ {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: no-referrer";
}
location ^~ /render/ {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: no-referrer";
}
location ^~ /connect/ {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: no-referrer";
}
location ^~ /catalog/ {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: no-referrer";
}
location ^~ /scim {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: no-referrer";
}
location = /healthz {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: no-referrer";
    access_log off;
}
location = /metrics {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: no-referrer";
}
