# YunoHost's server-level headers replace the upstream's, so each location sets
# the last word: the shell's policy on /, the server's own elsewhere (doc/ADMIN.md).

# The web shell: the same policy as lolly.tools.
location / {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.shell-headers.inc;
    include conf.d/yunohost_panel.conf.inc;
}

# The server's routes keep its CSP, and its Referrer-Policy so form posts pass CSRF.
location ^~ /api/ {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: $upstream_http_referrer_policy";
}
location ^~ /admin {
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.proxy.inc;
    more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    more_set_headers "Referrer-Policy: $upstream_http_referrer_policy";
    include conf.d/yunohost_panel.conf.inc;
}
