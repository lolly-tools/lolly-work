# The Lolly appliance reboots into a prepared host snapshot only in this
# window (machine time), after transactional-update (01:00) and lolly-update
# (02:30) have run. health-checker then checks Lolly Work and rolls the host
# back if a host update broke it.
[rebootmgr]
window-start=04:00
window-duration=1h30m
strategy=maint-window
