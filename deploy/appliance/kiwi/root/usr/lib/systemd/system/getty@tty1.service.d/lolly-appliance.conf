# The machine's own screen also shows the one-time owner setup link, which
# lolly-appliance-console.service writes to /run/lolly/local-issue.d. Serial
# consoles, often logged by a cloud or hypervisor, do not.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset --noclear --issue-file /etc/issue:/etc/issue.d:/run/issue:/run/issue.d:/usr/lib/issue:/usr/lib/issue.d:/run/lolly/local-issue.d - ${TERM}
