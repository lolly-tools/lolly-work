# HTTPS for the appliance's k3s profile, using K3s's bundled Traefik.
#
# The machine's own self-signed certificate (created at first boot, its key kept
# as a systemd credential) becomes Traefik's default certificate, so a browser
# or app that reaches the appliance by IP address, which sends no server name,
# gets this certificate rather than Traefik's generated one. The secret
# lolly-appliance-tls is written by lolly-appliance-secrets.service.
#
# Pairing the apps by QR code (the certificate's fingerprint) and a public
# domain with ACME come later; either replaces the default certificate here and
# changes instance.baseUrl, nothing else.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: lolly-appliance-tls
---
# Plain HTTP on port 80 only redirects to HTTPS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: lolly
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lolly-work-http
  namespace: lolly
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: lolly-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lolly-work
                port:
                  number: 80
