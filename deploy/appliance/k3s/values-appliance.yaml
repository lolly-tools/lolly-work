# Lolly Work values for the appliance's k3s profile.
#
# generate.py fills the @...@ placeholders from deploy/marketplaces/release.json
# and embeds this file in the HelmChart manifest that K3s's Helm controller
# applies. Values that belong to one machine (its address, its owner) are not
# here: the first boot writes them to a HelmChartConfig of the same name
# (lolly-work-instance.yaml), which K3s merges over these values.
#
# Secrets come from the lolly-work-secrets Secret, which
# lolly-appliance-secrets.service creates from this machine's systemd
# credentials. Nothing secret is in the image or in this file.
replicaCount: 1

image:
  repository: "@SERVER_REPOSITORY@"
  digest: "@SERVER_DIGEST@"
  # The image is preloaded from /var/lib/rancher/k3s/agent/images, so first
  # boot needs no registry.
  pullPolicy: IfNotPresent

existingSecret: lolly-work-secrets

# K3s's network policy controller admits a new pod to PostgreSQL (the
# lolly-postgres NetworkPolicy) a moment after the pod starts, and the
# migration Job connects at once, so every attempt was refused. It now waits
# up to 90 s for the database port, then migrates as the chart's default does.
migrate:
  command:
    - sh
    - -ec
    - |
      node -e '
      const target = new URL(process.env.DATABASE_URL), net = require("node:net");
      let tries = 0;
      (function attempt() {
        const socket = net.connect(Number(target.port) || 5432, target.hostname, () => { socket.end(); process.exit(0); });
        socket.on("error", () => { if (++tries >= 90) process.exit(1); setTimeout(attempt, 1000); });
      })();'
      exec node scripts/migrate.ts

# Lolly Work's own settings come from deploy/appliance/work-config.json, the
# one file both profiles use (the podman profile writes it as instance.json).
# It lists every key of the chart's default config, so Helm's merge adds
# nothing and both profiles run the same configuration. In short: production
# mode, the demo pack inside the image (unsigned, so an operator-provisioned
# publication generation), email and password sign-in with gated access,
# telemetry off, guest links off, and hooked tools allowed in the server
# process because the demo pack is curated and there is no render worker yet.
# This machine's address and owner are written at boot (see above).
config: @WORK_CONFIG@

# K3s's bundled Traefik serves HTTPS on 443 with the machine's own certificate
# (lolly-https.yaml makes it Traefik's default certificate) and redirects 80.
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: ""
      paths:
        - { path: /, pathType: Prefix }
  tls: []

networkPolicy:
  enabled: true
  # Traefik runs in kube-system.
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: kube-system

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }

tmp:
  sizeLimit: 256Mi
