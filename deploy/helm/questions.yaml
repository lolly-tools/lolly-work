questions:
  - variable: existingSecret
    label: Existing installation Secret
    description: Pre-create DATABASE_URL, LW_SESSION_SECRET, LW_LINK_SECRET and optional LW_IDP_CLIENT_SECRET, LW_CREDENTIAL_SECRET and LW_CATALOG_SIGNING_KEY. Keep keys stable across upgrades.
    type: string
    required: true
    group: Installation
  - variable: config.instance.baseUrl
    label: Public HTTPS origin
    description: Must match ingress and the OIDC client's registered callback origin.
    type: string
    required: true
    default: https://work.example.com
    group: Identity
  - variable: config.idp.issuer
    label: OIDC issuer
    type: string
    required: true
    group: Identity
  - variable: config.idp.clientId
    label: OIDC client ID
    type: string
    required: true
    group: Identity
  - variable: ingress.enabled
    label: Enable ingress
    description: Configure hosts and TLS in YAML for your cluster. These questions do not provision a database, identity client, certificate or web shell.
    type: boolean
    default: false
    group: Networking
  - variable: install.route
    label: Upgrade steps for
    description: Installed from this form, the release notice shows Rancher's upgrade steps. Choose fleet or argocd when Git manages this app.
    type: enum
    options:
      - rancher
      - helm
      - fleet
      - argocd
      - other
    default: rancher
    group: Updates
  - variable: updates.check
    label: Check for new releases
    description: Read the published chart index once a day, a plain request that carries nothing about this instance or its people, and show owners and admins a notice when a newer release is out. The notice is information only; Lolly Work never upgrades itself.
    type: boolean
    default: true
    group: Updates
  - variable: updates.channel
    label: Release channel
    description: stable shows releases only; preview includes pre-releases.
    type: enum
    options:
      - stable
      - preview
    default: stable
    show_if: updates.check=true
    group: Updates
