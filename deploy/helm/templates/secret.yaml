{{- /*
Chart-managed Secret (Mode A). Skipped entirely when existingSecret is set.

It is annotated as a pre-install/pre-upgrade hook (weight -10, before the
migrate Job at -5) so that on a FRESH install DATABASE_URL and the LW_* secrets
exist before the migrate Job — a pre-install hook — needs to read them; normal
resources are created only after all pre-install hooks finish. The Deployment
(a normal resource) then references it by name. before-hook-creation keeps it
refreshed on every upgrade. For production prefer Mode B (existingSecret) from
your platform's secret store, which sidesteps hook lifecycle entirely.
*/ -}}
{{- if eq (include "lolly-work.manageSecret" .) "true" }}
{{- include "lolly-work.validate" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lolly-work.secretName" . }}
  labels:
    {{- include "lolly-work.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- if .Values.database.url }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  LW_SESSION_SECRET: {{ required "secrets.sessionSecret is required (or use existingSecret)" .Values.secrets.sessionSecret | quote }}
  LW_LINK_SECRET: {{ required "secrets.linkSecret is required (or use existingSecret)" .Values.secrets.linkSecret | quote }}
  {{- if .Values.secrets.idpClientSecret }}
  LW_IDP_CLIENT_SECRET: {{ .Values.secrets.idpClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.credentialSecret }}
  LW_CREDENTIAL_SECRET: {{ .Values.secrets.credentialSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.metricsToken }}
  LW_METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  {{- end }}
  {{- if .Values.renderWorker.secret }}
  LW_RENDER_WORKER_SECRET: {{ .Values.renderWorker.secret | quote }}
  {{- end }}
  {{- if .Values.c2pa.signingKey }}
  LW_C2PA_SIGNING_KEY: {{ .Values.c2pa.signingKey | quote }}
  {{- end }}
{{- end }}
