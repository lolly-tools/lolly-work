{{- /*
Optional NetworkPolicy. Restricts ingress to the app's HTTP port; egress is
left open by default so the plane can reach Postgres, your IdP, and providers.
*/ -}}
{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lolly-work.fullname" . }}
  labels:
    {{- include "lolly-work.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lolly-work.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if not .Values.networkPolicy.allowAllEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressNamespaceSelector }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  {{- if .Values.networkPolicy.allowAllEgress }}
  egress:
    - {}
  {{- end }}
{{- end }}
