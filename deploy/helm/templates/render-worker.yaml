{{- if .Values.renderWorker.enabled }}
{{- if not .Values.existingSecret }}
{{- if not .Values.renderWorker.secret }}
{{- fail "renderWorker.secret is required when renderWorker.enabled (or provide it via existingSecret). openssl rand -hex 32" }}
{{- end }}
{{- end }}
{{- include "lolly-work.validateWorkerWebBase" . }}
{{- $startupMs := .Values.renderWorker.browserStartupTimeoutMs }}
{{- $seccomp := .Values.renderWorker.seccompProfile }}
{{- if not (and (kindIs "map" $seccomp) (has $seccomp.type (list "RuntimeDefault" "Localhost"))) }}
{{- fail "renderWorker.seccompProfile must use RuntimeDefault or Localhost" }}
{{- end }}
{{- if and (eq $seccomp.type "Localhost") (not (regexMatch "^[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*\\.json$" ($seccomp.localhostProfile | default ""))) }}
{{- fail "renderWorker.seccompProfile.localhostProfile must name a reviewed relative JSON profile" }}
{{- end }}
{{- if or (not (or (kindIs "int" $startupMs) (kindIs "int64" $startupMs) (kindIs "float64" $startupMs))) (ne (float64 $startupMs) (float64 (int $startupMs))) (lt (int $startupMs) 1000) (gt (int $startupMs) 120000) }}
{{- fail "renderWorker.browserStartupTimeoutMs must be an integer from 1000 to 120000" }}
{{- end }}
{{- $userNamespace := .Values.renderWorker.userNamespace.enabled }}
{{- if not (kindIs "bool" $userNamespace) }}
{{- fail "renderWorker.userNamespace.enabled must be true or false" }}
{{- end }}
{{- /* An API server without user-namespace support drops hostUsers instead of rejecting
       it, which would leave SYS_ADMIN in the node's namespace. The worker refuses that at
       startup as well (workers/render/src/user-namespace.ts). */}}
{{- if and $userNamespace (not (semverCompare ">=1.33.0-0" .Capabilities.KubeVersion.Version)) }}
{{- fail "renderWorker.userNamespace requires Kubernetes 1.33 or newer (hostUsers: false); pass --kube-version when rendering offline" }}
{{- end }}
{{- $name := printf "%s-render-worker" (include "lolly-work.fullname" .) }}
{{- $tlsSecret := required "renderWorker.tls.existingSecret is required when the worker is enabled" .Values.renderWorker.tls.existingSecret }}
{{- $caSecret := required "renderWorker.tls.caSecret is required when the worker is enabled" .Values.renderWorker.tls.caSecret }}
{{- $serverName := .Values.renderWorker.tls.serverName | default (printf "%s.%s.svc" $name .Release.Namespace) }}
{{- if not (regexMatch "^[a-zA-Z0-9.-]+$" $serverName) }}
{{- fail "renderWorker.tls.serverName must be a DNS name" }}
{{- end }}
{{- $image := include "lolly-work.imageRef" (dict "image" .Values.renderWorker.image "defaultTag" .Chart.AppVersion "name" "renderWorker.image") }}
{{- $pullSecrets := .Values.imagePullSecrets }}
{{- if kindIs "slice" .Values.renderWorker.imagePullSecrets }}
{{- $pullSecrets = .Values.renderWorker.imagePullSecrets }}
{{- else if not (kindIs "invalid" .Values.renderWorker.imagePullSecrets) }}
{{- fail "renderWorker.imagePullSecrets must be null (inherit) or a list" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "lolly-work.labels" . | nindent 4 }}
    app.kubernetes.io/component: render-worker
spec:
  {{- if not .Values.renderWorker.autoscaling.enabled }}
  replicas: {{ .Values.renderWorker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lolly-work.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: render-worker
  template:
    metadata:
      labels:
        {{- include "lolly-work.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: render-worker
    spec:
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lolly-work.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if $userNamespace }}
      hostUsers: false
      {{- end }}
      {{- with .Values.renderWorker.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.renderWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.renderWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.renderWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.renderWorker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: render-worker
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.renderWorker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              {{- if $userNamespace }}
              # Scoped to the pod's own user namespace: lets the runtime's default
              # seccomp profile permit Chromium's unshare(CLONE_NEWUSER).
              add: ["SYS_ADMIN"]
              {{- end }}
            seccompProfile:
              {{- toYaml $seccomp | nindent 14 }}
          env:
            - name: LW_RENDER_DEPLOYMENT_MODE
              value: production
            {{- if $userNamespace }}
            - name: LW_RENDER_REQUIRE_USER_NAMESPACE
              value: "1"
            {{- end }}
            - name: LW_RENDER_TLS_CERT_FILE
              value: /run/render-tls/tls.crt
            - name: LW_RENDER_TLS_KEY_FILE
              value: /run/render-tls/tls.key
            - name: LW_RENDER_TLS_CA_FILE
              value: /run/render-trust/ca.crt
            - name: LW_RENDER_TLS_SERVER_NAME
              value: {{ $serverName | quote }}
            - name: PORT
              value: {{ .Values.renderWorker.service.port | quote }}
            - name: LOLLY_WEB_BASE
              value: {{ .Values.renderWorker.webBase | quote }}
            {{- with .Values.renderWorker.allowedOrigins }}
            # Origins a rendered page may reach even on a private address (plans/58 WP0).
            - name: LW_RENDER_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: LW_RENDER_MAX_CONCURRENT
              value: {{ .Values.renderWorker.maxConcurrent | quote }}
            - name: LW_RENDER_BROWSER_STARTUP_TIMEOUT_MS
              value: {{ $startupMs | quote }}
            - name: LW_RENDER_WORKER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lolly-work.secretName" . }}
                  key: LW_RENDER_WORKER_SECRET
          ports:
            - name: https
              containerPort: {{ .Values.renderWorker.service.port }}
          # Liveness: is the process alive at all — independent of load, never
          # driven by the concurrency cap below.
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 20
          # Readiness requires a connected sandboxed browser and free capacity.
          # Browser startup or recovery keeps the pod out of the Service.
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.renderWorker.resources | nindent 12 }}
          volumeMounts:
            - name: render-tls
              mountPath: /run/render-tls
              readOnly: true
            - name: render-trust
              mountPath: /run/render-trust
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: render-tls
          secret:
            secretName: {{ $tlsSecret | quote }}
        - name: render-trust
          secret:
            secretName: {{ $caSecret | quote }}
            items: [{ key: ca.crt, path: ca.crt }]
        - name: tmp
          {{- include "lolly-work.emptyDir" (dict "sizeLimit" .Values.renderWorker.tmp.sizeLimit "name" "renderWorker.tmp.sizeLimit") | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "lolly-work.labels" . | nindent 4 }}
    app.kubernetes.io/component: render-worker
spec:
  type: ClusterIP
  selector:
    {{- include "lolly-work.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: render-worker
  ports:
    - name: https
      port: {{ .Values.renderWorker.service.port }}
      targetPort: https
{{- end }}
