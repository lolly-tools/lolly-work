{{- /*
Render worker NetworkPolicy (plans/58 WP0). The worker runs the least-trusted content
there is: tool hooks, a Sandbox pen, any page a render asks for. Its in-process egress
rule (workers/render/src/egress.ts) already refuses private, loopback, link-local and
metadata addresses, but Chromium resolves a name again when it connects, so this policy
closes the same door at the network: ingress only from the control plane on the worker
port; egress only to cluster DNS, to public addresses on 80/443, and to the destinations
you list in renderWorker.networkPolicy.extraEgress.

Off by default, like the app's own policy, because it has to know where the shell lives.
With renderWorker.webBase on a public address (https://lolly.tools, or your instance's
public URL) the defaults work. A shell on a private address (an in-cluster Service, an
internal load balancer) needs an extraEgress rule for it, and so does any origin you
list in LW_RENDER_ALLOWED_ORIGINS.
*/ -}}
{{- if and .Values.renderWorker.enabled .Values.renderWorker.networkPolicy.enabled -}}
{{- include "lolly-work.validateWorkerNetworkPolicy" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lolly-work.fullname" . }}-render-worker
  labels:
    {{- include "lolly-work.labels" . | nindent 4 }}
    app.kubernetes.io/component: render-worker
spec:
  podSelector:
    matchLabels:
      {{- include "lolly-work.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: render-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the control plane's own pods dispatch renders.
    - from:
        - podSelector:
            matchLabels:
              {{- include "lolly-work.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: control-plane
      ports:
        - protocol: TCP
          port: {{ .Values.renderWorker.service.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.renderWorker.networkPolicy.dnsNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.renderWorker.networkPolicy.dnsPodLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Public addresses only: the private, shared-address, loopback, link-local (cloud
    # metadata) and unspecified ranges are carved out, the same set egress.ts refuses.
    {{- with .Values.renderWorker.networkPolicy.publicPorts }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              # The covering IPv6 parent avoids Kubernetes parsing mapped96 as IPv4.
              - ::fffe:0:0/95
              - 64:ff9b::/96
              - 100::/64
              - 2001:db8::/32
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- with .Values.renderWorker.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
