# Single-node Garage for the optional `garage` Compose profile. The RPC secret
# comes from GARAGE_RPC_SECRET in the environment, never from this file.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

# One node holds one copy. Raise this only with more nodes (Garage's own docs).
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
